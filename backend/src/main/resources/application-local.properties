spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/cloudpay}
spring.datasource.username=${SUPABASE_DB_USER:cloudpay}
spring.datasource.password=${SUPABASE_DB_PASSWORD:}
cloudpay.supabase.url=${SUPABASE_URL:}
cloudpay.supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY:}
cloudpay.supabase.secret-key=${SUPABASE_SECRET_KEY:}
cloudpay.supabase.jwks-url=${SUPABASE_JWKS_URL:}
spring.security.oauth2.resourceserver.jwt.issuer-uri=${SUPABASE_ISSUER_URI:}
cloudpay.cors.allowed-origins=http://localhost:3000
